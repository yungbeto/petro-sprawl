<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- share:start -->
    <title>Petro Sprawl</title>
    <meta name="description" content="The world's oil and gas pipelines, LNG terminals, chokepoints and basins, with the flows measured through them." />
    <!-- Home's social card: public/og.png, from npm run render:og. Crawlers need absolute URLs, so these name production. A link to a page gets its own tags in place of this block (server/page.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Petro Sprawl" />
    <meta property="og:title" content="Petro Sprawl: the sprawling empire of the petro-state" />
    <meta property="og:description" content="The world's oil and gas pipelines, LNG terminals, chokepoints and basins, with the flows measured through them." />
    <meta property="og:url" content="https://petrosprawl.fyi/" />
    <meta property="og:image" content="https://petrosprawl.fyi/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Petro Sprawl, the sprawling empire of the petro-state, beside a globe drawn in dots, centred on the Gulf" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- share:end -->
    <script>
      // Apply a manual theme before first paint to avoid a flash. Mirrors src/app/useTheme.ts.
      try {
        var t = localStorage.getItem('et.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <!-- The largest dataset starts downloading with the code, not after it runs (src/app/useDatasets.ts). -->
    <link rel="preload" href="%BASE_URL%data/pipelines.json" as="fetch" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
