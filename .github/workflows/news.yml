name: News

# News scan every 12 hours (jobs/scan-news.ts, SPEC M9). Headlines from GDELT and Google News are matched
# to mapped assets; Claude drafts from the articles and code checks every draft against the page. New
# sources from trusted domains on disruptions in effect are committed to main, marked unreviewed. New
# disruptions, end dates and anything else open a pull request. The run is red when neither feed answers
# or Google News has failed three runs in a row, but what it found is still committed.

on:
  schedule:
    - cron: '23 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Shares the data workflow's group so the two never push to main at the same time.
concurrency:
  group: data
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ vars.NEWS_SCAN != 'off' }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scan the news
        id: scan
        continue-on-error: true
        run: npm run scan:news

      - name: Commit sources and scan state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data/curated; then
            npm run build:curated
          fi
          git add data/curated public/data data/reports/dedup.json data/reports/scan-news.json data/reports/news-state.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Scan news $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push

      - name: Open a pull request for drafts that need review
        run: |
          if [ "$(jq length data/reports/disruption-drafts.json)" -eq 0 ]; then
            echo "No drafts need review"
            exit 0
          fi
          branch="news/$(date -u +%Y-%m-%d-%H%M)"
          git checkout -b "$branch"
          npm run apply:disruption-drafts
          npm run build:curated
          git add data/curated public/data data/reports/dedup.json
          git commit -m "Disruption drafts for review $(date -u +%Y-%m-%d)"
          git push -u origin "$branch"
          {
            echo "Disruption updates drafted by the news scan that need a person to check them. Each passed the automatic checks: the quote is on the page and names the asset, and the date comes from the page."
            echo
            jq -r '.[] | "- **\(.ref)** (\(.action | gsub("_"; " "))): \(if .disruption then .disruption.summary else "\(.disruptionId)\(if .endedAt then ", ended \(.endedAt)" else "" end)\(if .cause then ", cause \(.cause)" else "" end)" end) [\(.source.publisher), \(.source.publishedAt)](\(.source.url))\n  - Needs review because \(.reason)"' data/reports/disruption-drafts.json
            echo
            echo "Every outcome, including rejected drafts, is in data/reports/scan-news.json and the log of the run that opened this pull request."
          } > pr-body.md
          gh pr create --base main --head "$branch" --title "Disruption drafts for review $(date -u +%Y-%m-%d)" --body-file pr-body.md

      - name: Fail if the scan failed
        if: ${{ steps.scan.outcome == 'failure' }}
        run: |
          echo "The scan reported a problem; see its step above."
          exit 1
