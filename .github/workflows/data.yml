name: Data

# Fetches scheduled datasets into public/data and commits them if they changed.
# A failed fetch keeps the previous file and records the failure in its meta file (still committed),
# then fails the run so the failure shows in the Actions tab.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: PortWatch chokepoint transits
        id: portwatch
        continue-on-error: true
        run: npm run fetch:portwatch

      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Fail if any fetch failed
        if: steps.portwatch.outcome == 'failure'
        run: |
          echo "::error::One or more fetch jobs failed; previous data was kept. See the step logs above."
          exit 1
