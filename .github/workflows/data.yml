name: Data

# Fetches scheduled datasets into public/data and commits them if they changed.
# A failed fetch keeps the previous file and records the failure in its meta file (still committed),
# then fails the run so the failure shows in the Actions tab.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # PortWatch runs in its own workflow (portwatch.yml).
    timeout-minutes: 20
    env:
      AGSI_API_KEY: ${{ secrets.AGSI_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      # Latest main, not the commit the run was queued at: a run that waited on the data group starts from
      # what the run before it pushed.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ENTSOG gas flows
        id: entsog
        continue-on-error: true
        run: npm run fetch:entsog

      # Skipped until the AGSI_API_KEY secret exists.
      - name: AGSI+ gas storage
        id: agsi
        if: env.AGSI_API_KEY != ''
        continue-on-error: true
        run: npm run fetch:agsi

      # ALSI takes the same GIE key as AGSI+.
      - name: GIE ALSI LNG send-out
        id: alsi
        if: env.AGSI_API_KEY != ''
        continue-on-error: true
        run: npm run fetch:alsi

      # EIA publishes monthly, about two months behind; a run every 6 hours just keeps it current.
      - name: EIA crude origins
        id: eia
        if: env.EIA_API_KEY != ''
        continue-on-error: true
        run: npm run fetch:eia

      # EIA's Short-Term Energy Outlook, monthly (SPEC M12): shale production by formation and rigs and wells
      # by region, history only. The run fails rather than publish a forecast month.
      - name: EIA shale plays
        id: shale
        if: env.EIA_API_KEY != ''
        continue-on-error: true
        run: npm run fetch:shale

      # EIA weekly by region (needs the EIA key), Statistics Canada and JODI monthly (no key). Each dataset
      # keeps its previous file on its own failure.
      - name: Gas storage beyond AGSI+
        id: storage
        continue-on-error: true
        run: npm run fetch:storage

      # Eurostat monthly (no key), UN Comtrade annual (refreshed weekly; COMTRADE_API_KEY, or the public
      # preview without one) and the US from the EIA file written above.
      - name: Crude imports by country
        id: crude
        continue-on-error: true
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        run: npm run fetch:crude-imports

      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
            # A push to main during the run (a code change, or the claims job) would reject ours, so
            # rebase onto it first; this job only touches public/data. Retry once if it moves again.
            git pull --rebase origin main && git push || (sleep 10 && git pull --rebase origin main && git push)
          fi

      - name: Fail if any fetch failed
        if: steps.entsog.outcome == 'failure' || steps.agsi.outcome == 'failure' || steps.alsi.outcome == 'failure' || steps.eia.outcome == 'failure' || steps.shale.outcome == 'failure' || steps.storage.outcome == 'failure' || steps.crude.outcome == 'failure'
        run: |
          echo "::error::One or more fetch jobs failed; previous data was kept. See the step logs above."
          exit 1
