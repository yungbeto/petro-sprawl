name: Claims

# Weekly claims refresh (jobs/refresh-claims.ts). Claude looks for newer dated sources for cited claims
# older than 30 days; every draft is checked against the page itself. Confirmations whose quote names
# the asset are committed to main (marked unreviewed when the domain is off the trusted list). Status
# changes, first claims and quotes that don't name the asset go to one rolling pull request.

on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # To see whether this week's refresh already ran.
  actions: read

# Shares the data workflow's group so the two never push to main at the same time.
concurrency:
  group: data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ vars.CLAIMS_REFRESH != 'off' }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Latest main, not the commit the run was queued at: a run that waited on the data group starts from
      # what the run before it pushed.
      - uses: actions/checkout@v7
        with:
          ref: main

      # GitHub can run a schedule late and more than once (2026-11-02: twice, ten hours late). One refresh a
      # week is enough; a run by hand always goes ahead.
      - name: Skip a repeated schedule
        id: recent
        if: github.event_name == 'schedule'
        run: |
          since=$(date -u -d '6 days ago' +%Y-%m-%dT%H:%M:%SZ)
          done=$(gh run list --workflow claims.yml --status success --limit 10 --json createdAt --jq "[.[] | select(.createdAt > \"$since\")] | length")
          if [ "$done" -gt 0 ]; then
            echo "Claims were refreshed in the last 6 days; skipping this run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.recent.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.recent.outputs.skip != 'true'

      - name: Refresh stale claims
        if: steps.recent.outputs.skip != 'true'
        run: npm run refresh:claims

      - name: Commit confirmations
        if: steps.recent.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/curated; then
            echo "No confirmations"
            exit 0
          fi
          npm run build:curated
          git add data/curated public/data data/reports/dedup.json data/reports/refresh-claims.json
          git commit -m "Refresh claims $(date -u +%Y-%m-%d)"
          # The drafts (claim-drafts.json) stay unstaged for the review step below; set them aside while rebasing.
          git pull --rebase --autostash
          git push

      # One rolling pull request (claims/review), rebuilt from main each run with the drafts still waiting on
      # it plus this run's (jobs/lib/review.ts); it closes itself when none are left.
      - name: Update the review pull request
        if: steps.recent.outputs.skip != 'true'
        run: |
          branch="claims/review"
          pending="$RUNNER_TEMP/pending.json"
          echo '[]' > "$pending"
          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            git fetch origin "$branch"
            git show "origin/$branch:data/reports/claim-drafts.json" > "$pending" || echo '[]' > "$pending"
          fi
          npm run merge:review-drafts -- claims "$pending"
          if [ "$(jq length data/reports/claim-drafts.json)" -eq 0 ]; then
            if [ -n "$pr" ]; then
              gh pr close "$pr" --delete-branch --comment "Nothing left to review: main already cites these sources, or the assets are gone."
            fi
            echo "No drafts need review"
            exit 0
          fi
          git checkout -B "$branch"
          npm run apply:claim-drafts
          npm run build:curated
          # claim-drafts.json is gitignored on main; on this branch it's what the next run carries over.
          git add data/curated public/data data/reports/dedup.json
          git add -f data/reports/claim-drafts.json
          git commit -m "Claim drafts for review $(date -u +%Y-%m-%d)"
          git push --force origin "$branch"
          {
            echo "Claims drafted by the weekly refresh that need a person to check them. Each passed the automatic checks: the quote is on the page, the date comes from the page, and the claim is newer than the one it replaces."
            echo
            jq -r '.[] | "- **\(.ref)**: \(.evidence.status), \(.evidence.observedAt). \(.evidence.statement) [Source](\(.evidence.url))\n  - Needs review because \(.reason)"' data/reports/claim-drafts.json
            echo
            echo "This pull request is rebuilt from main on every refresh, keeping these drafts and adding new ones. Merge it to publish them all, or close it to drop them all. To drop one, delete it from data/reports/claim-drafts.json on this branch; the next refresh rebuilds the rest (other edits on the branch are replaced)."
            echo
            echo "Every outcome, including rejected drafts, is in the log of the workflow run that last updated this pull request."
          } > pr-body.md
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file pr-body.md
          else
            gh pr create --base main --head "$branch" --title "Claim drafts for review" --body-file pr-body.md
          fi
